spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3307/t_bank?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:}
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: ${RABBIT_PASSWORD:}
    virtual-host: /
    listener:
      simple:
        concurrency: 2
        max-concurrency: 4
        prefetch: 10
        acknowledge-mode: auto
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.bank.bankfinance.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

jwt:
  secret: ${JWT_SECRET:smartBankJwtSecretKeyAtLeast32BytesLong!2026}
  expiration: 86400000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: account
      paths-to-match: /account/**

knife4j:
  enable: true
  setting:
    language: zh_cn

ai:
  api-key: ${API_KEY:}
  model: deepseek-chat
  base-url: https://api.deepseek.com

face:
  base-url: http://localhost:8001
  timeout-ms: 30000

# 股票行情源:simulated=模拟行情(默认) | sina=新浪真实行情(预留)
stock:
  quote-provider: simulated

